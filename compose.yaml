
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-web:${APP_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000" #왼쪽은내컴퓨터 포트, 오른쪽은 컨테이너 내부포트
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
